<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for site/og.png (1200x630 social preview). Re-render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=site/og.png assets/og.html -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0d0f12; color: #eceef1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    padding: 64px 72px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center;
    background-image: radial-gradient(600px 400px at 85% 20%, rgba(52,211,153,.10), transparent 70%);
  }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; margin-bottom: 44px; }
  .mark { width: 44px; height: 44px; border-radius: 11px; background: #34d399; display: grid; place-items: center; }
  h1 { font-size: 58px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; }
  h1 em { font-style: normal; color: #34d399; }
  p { margin-top: 26px; font-size: 24px; color: #9aa1ac; }
  .card { background: #15181d; border: 1px solid #272c34; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #272c34; font-size: 17px; color: #9aa1ac; }
  .head b { color: #eceef1; }
  .pill { font: 600 14px ui-monospace, Menlo, monospace; padding: 6px 10px; border-radius: 999px; background: #2c1517; color: #f87171; }
  .row { display: grid; grid-template-columns: 1.3fr 1fr 0.9fr; padding: 15px 20px; border-top: 1px solid #272c34; font-size: 19px; font-variant-numeric: tabular-nums; }
  .row:first-of-type { border-top: 0; }
  .row span:nth-child(2), .row span:nth-child(3) { text-align: right; }
  .cust { font-family: ui-monospace, Menlo, monospace; font-size: 17px; color: #c9ced6; }
  .bad { background: #2c1517; }
  .neg { color: #f87171; font-weight: 700; }
  .pos { color: #34d399; font-weight: 700; }
</style></head>
<body>
  <div>
    <div class="logo"><span class="mark"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="#062b1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4l5 4.5L13 4v8"/></svg></span>MarginCap</div>
    <h1>Find the customers your AI features are <em>losing you money</em> on.</h1>
    <p>LLM cost + Stripe revenue = margin per customer.</p>
  </div>
  <div class="card">
    <div class="head"><span><b>Margin by customer</b> · 30 days</span><span class="pill">2 losing money</span></div>
    <div class="row bad"><span class="cust">cus_8fK2…</span><span>$64.10</span><span class="neg">−121%</span></div>
    <div class="row bad"><span class="cust">cus_Q1xa…</span><span>$52.80</span><span class="neg">−8%</span></div>
    <div class="row"><span class="cust">cus_3mPz…</span><span>$18.40</span><span class="pos">81%</span></div>
    <div class="row"><span class="cust">cus_Lr7d…</span><span>$2.15</span><span class="pos">93%</span></div>
    <div class="row"><span class="cust">cus_Wb0e…</span><span>$0.88</span><span class="pos">97%</span></div>
  </div>
</body></html>
