<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for site/og.png (1200x630 social preview). Re-render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=site/og.png assets/og.html -->
<style>
  /* Same system as the site: greyscale, with green/red only for profit/loss */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f5f5f7; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 64px 0 80px; display: grid; grid-template-columns: 460px 1fr; gap: 48px; align-items: center;
  }
  .name { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #6e6e73; margin-bottom: 22px; }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -0.04em; font-weight: 600; }
  p { text-wrap: balance; margin-top: 28px; font-size: 26px; line-height: 1.3; letter-spacing: -0.016em; color: #6e6e73; }
  .url { margin-top: 40px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; color: #1d1d1f; }

  /* The product shot: the table is the pitch */
  .window {
    background: #fff; border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 40px 90px -24px rgba(0,0,0,.28), 0 14px 28px -14px rgba(0,0,0,.14);
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 26px 16px; }
  .head b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .head span { font-size: 17px; color: #6e6e73; }
  .head .loss { color: #c4281c; font-weight: 600; }
  .cols, .row { display: grid; grid-template-columns: 128px 84px 84px 1fr; align-items: center; padding: 0 26px; }
  .cols { font-size: 15px; color: #6e6e73; padding-bottom: 12px; border-bottom: 1px solid #d2d2d7; }
  .row { height: 62px; font-size: 19px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; border-bottom: 1px solid #ececf0; }
  .row:last-child { border-bottom: 0; }
  .cols span:nth-child(2), .cols span:nth-child(3), .row span:nth-child(2), .row span:nth-child(3) { text-align: right; }
  .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 16px; letter-spacing: 0; }
  .bad { background: #fff2f1; }
  .m { display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-weight: 600; }
  .loss { color: #c4281c; }
  .gain { color: #1a7f37; }
  .bar { position: relative; width: 64px; height: 8px; }
  .bar::before { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 1px; background: #d2d2d7; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .bar .down { right: 50%; background: #c4281c; }
  .bar .up { left: 50%; background: #1a7f37; }
</style></head>
<body>
  <div>
    <div class="name">MarginCap</div>
    <h1>Your AI bill, split by customer.</h1>
    <p>See which customers cost more than they pay, and cap them.</p>
    <div class="url">margincap.dev</div>
  </div>
  <div class="window">
    <div class="head"><b>Margin by customer</b><span class="loss">2 losing money</span></div>
    <div class="cols"><span>Customer</span><span>Revenue</span><span>AI cost</span><span></span></div>
    <div class="row bad"><span class="id">cus_8fK2…</span><span>$29.00</span><span>$64.10</span><span class="m loss">−121%<span class="bar"><i class="down" style="width:32px"></i></span></span></div>
    <div class="row bad"><span class="id">cus_Q1xa…</span><span>$49.00</span><span>$52.80</span><span class="m loss">−8%<span class="bar"><i class="down" style="width:3px"></i></span></span></div>
    <div class="row"><span class="id">cus_3mPz…</span><span>$99.00</span><span>$18.40</span><span class="m gain">81%<span class="bar"><i class="up" style="width:26px"></i></span></span></div>
    <div class="row"><span class="id">cus_Lr7d…</span><span>$29.00</span><span>$2.15</span><span class="m gain">93%<span class="bar"><i class="up" style="width:30px"></i></span></span></div>
    <div class="row"><span class="id">cus_Wb0e…</span><span>$29.00</span><span>$0.88</span><span class="m gain">97%<span class="bar"><i class="up" style="width:31px"></i></span></span></div>
  </div>
</body></html>
