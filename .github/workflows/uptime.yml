# Runs the production smoke tests every 3 hours. A failed run emails the repo owner
# (GitHub's default for scheduled workflows). ~1 min per run, well inside the free Actions minutes.
name: Uptime

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test margincap.dev
        run: bash tests/smoke.sh https://margincap.dev
